[alembic]
script_location = migrations

# sqlalchemy.url is read at runtime by migrations/env.py from ebay_dropship.config.Settings()
# (.env / environment variables take priority). Do not hardcode it here.
#
# NOTE: keep this file ASCII-only (English comments only). Alembic's own CLI reads this file
# with configparser using encoding="locale" (see alembic.util.compat.read_config_parser), which
# on a Japanese-locale Windows machine resolves to cp932. A UTF-8-encoded non-ASCII comment here
# would then fail to decode with a UnicodeDecodeError before migrations/env.py even runs, and
# that read path is inside Alembic itself so it cannot be fixed from this project's own code.
# ASCII bytes decode identically under cp932 and UTF-8, so staying ASCII-only sidesteps the
# mismatch entirely instead of requiring every user to change their locale/PYTHONUTF8 setting.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
